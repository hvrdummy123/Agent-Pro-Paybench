[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paybench"
version = "0.1.0"
description = "PayBench: a deterministic fintech agent benchmark for payments back-office operations"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "PayBench Contributors" }]
keywords = ["agents", "benchmark", "payments", "fintech", "llm", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "httpx>=0.27",
  "orjson>=3.10",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
google = ["google-genai>=1.0"]
all = ["paybench[anthropic,openai,google]"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
  "pytest-xdist>=3",
  "types-PyYAML>=6",
]

[project.scripts]
paybench = "paybench.cli:app"

[project.urls]
Homepage = "https://github.com/paybench/paybench"
Documentation = "https://github.com/paybench/paybench#readme"
Repository = "https://github.com/paybench/paybench"

[tool.hatch.build.targets.wheel]
packages = ["src/paybench"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  "/LICENSE",
  "/README.md",
  "/CITATION.cff",
  "/pyproject.toml",
]

[tool.hatch.build]
include = [
  "src/paybench/**/*.md",
  "src/paybench/**/*.yaml",
  "src/paybench/**/*.yml",
  "src/paybench/site/templates/**/*",
  "src/paybench/site/static/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["paybench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: longer-running tests",
  "e2e: end-to-end CLI tests",
]

[tool.coverage.run]
branch = true
source = ["paybench"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
omit = [
  "src/paybench/site/*",
  "src/paybench/cli.py",
  "src/paybench/__main__.py",
]
